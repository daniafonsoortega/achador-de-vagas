name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validar configuração pública
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ vars.PUBLIC_TELEGRAM_BOT_USERNAME }}
          SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
        run: python scripts/build_web_config.py web/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

