name: Verificações

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes Python
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxe Python
        run: python -m compileall -q scripts tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar JavaScript do site
        shell: python
        run: |
          import re, subprocess
          html = open("web/index.html", encoding="utf-8").read()
          script = re.search(r'<script type="module">([\s\S]*?)</script>', html).group(1)
          subprocess.run(["node", "--check", "--input-type=module"], input=script, text=True, check=True)

